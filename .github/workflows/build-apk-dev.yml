name: Build Android Development

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Expo Development Client
        run: npx expo install expo-dev-client

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/build.gradle*', '**/settings.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Prebuild Android
        run: npx expo prebuild --platform android --non-interactive

      - name: Build ARM64 Development APK
        run: cd android && ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          NODE_ENV: development

      - name: Rename APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          if [ -n "$APK_PATH" ]; then
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            mv "$APK_PATH" "android/app/build/outputs/apk/debug/apk-scope-dev-$TIMESTAMP.apk"
          fi

      - name: Locate APK
        run: find android/app/build/outputs -name "*.apk" -type f 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-scope-development
          path: android/app/build/outputs/apk/debug/apk-scope-dev-*.apk
          retention-days: 7
