name: Build Development APK (arm64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # This Expo build does not use the repository's tooling submodules.
        # Avoid fetching stale submodule SHAs during CI checkout.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Android SDK components
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platform-tools
            /usr/local/lib/android/sdk/platforms/android-37.0
            /usr/local/lib/android/sdk/build-tools/37.0.0
            /usr/local/lib/android/sdk/ndk/27.1.12297006
          key: ${{ runner.os }}-android-sdk-platform-37.0-build-tools-37.0.0-ndk-27.1.12297006

      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -e
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses >/dev/null 2>&1 || true
          $SDKMANAGER --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"

      - name: Alias android-37 platform
        run: |
          ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Install Expo Development Client
        run: npx expo install expo-dev-client

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Build Development APK (arm64-v8a)
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a -Pandroid.injected.build.abi=arm64-v8a -Pandroid.kotlinVersion=2.2.10

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          echo "=== Android app build outputs ==="
          if [ -d android/app/build/outputs ]; then
            find android/app/build/outputs -maxdepth 6 -type f -print
          else
            echo "android/app/build/outputs directory does not exist"
          fi

          echo "=== Search APK files in workspace ==="
          mapfile -t APK_FILES < <(find "$GITHUB_WORKSPACE" -type f -name '*.apk' -not -path '*/.gradle/*' -print)

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "::error::Gradle completed, but no APK file exists anywhere in the workspace."
            echo "=== App build directory ==="
            find android/app/build -maxdepth 5 -type d -print 2>/dev/null || true
            exit 1
          fi

          for apk in "${APK_FILES[@]}"; do
            echo "Found: $apk"
            cp "$apk" artifacts/
          done

          echo "=== Collected APK files ==="
          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-expo-development-client-arm64
          path: artifacts/*.apk
          if-no-files-found: error
