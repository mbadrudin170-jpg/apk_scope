name: Build Android Development

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Expo Development Client
        run: npx expo install expo-dev-client@~58.0.22

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'modules/**') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Prebuild Android
        run: npx expo prebuild --platform android
        env:
          CI: "1"

      - name: Build ARM64 Development APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          NODE_ENV: development

      - name: Validate and rename APK
        shell: bash
        run: |
          set -euo pipefail

          output_dir="android/app/build/outputs/apk/debug"
          mapfile -t apk_files < <(find "$output_dir" -maxdepth 1 -type f -name "*.apk" | sort)

          if [[ "${#apk_files[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one debug APK, found ${#apk_files[@]}."
            find android/app/build/outputs -type f -print 2>/dev/null || true
            exit 1
          fi

          apk_path="${apk_files[0]}"
          unzip -tq "$apk_path"

          mapfile -t native_libs < <(unzip -Z1 "$apk_path" | grep -E '^lib/[^/]+/[^/]+\.so$' || true)
          if [[ "${#native_libs[@]}" -eq 0 ]]; then
            echo "::error::APK does not contain native shared libraries; ARM64 cannot be verified."
            exit 1
          fi

          if ! printf '%s\n' "${native_libs[@]}" | grep -q '^lib/arm64-v8a/'; then
            echo "::error::APK does not contain arm64-v8a native libraries."
            printf '%s\n' "${native_libs[@]}"
            exit 1
          fi

          unexpected_abis="$(printf '%s\n' "${native_libs[@]}" | grep -v '^lib/arm64-v8a/' || true)"
          if [[ -n "$unexpected_abis" ]]; then
            echo "::error::Unexpected ABI libraries found in an ARM64-only APK:"
            printf '%s\n' "$unexpected_abis"
            exit 1
          fi

          timestamp="$(date +%Y%m%d-%H%M%S)"
          mv "$apk_path" "$output_dir/apk-scope-dev-$timestamp.apk"
          ls -lh "$output_dir/apk-scope-dev-$timestamp.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-development-arm64
          path: android/app/build/outputs/apk/debug/apk-scope-dev-*.apk
          if-no-files-found: error
          retention-days: 7
