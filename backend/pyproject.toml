[project]
name = "apk-scope-backend"
version = "0.1.0"
description = "Private APK analysis API for APK Scope"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]
ml = [
  "sentence-transformers>=3",
  "faiss-cpu>=1.8",
  "transformers>=4.45",
  "peft>=0.13",
  "trl>=0.11",
  "datasets>=3",
  "bitsandbytes>=0.44",
  "accelerate>=1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
