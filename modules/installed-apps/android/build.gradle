plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'expo-module-gradle-plugin'
}

group = 'host.exp.exponent'
version = '0.1.0'

android {
  namespace "expo.modules.installedapps"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation project(':expo-modules-core')
}
